<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="拾迹的小应用：让日常多一点方便，多一点乐趣。">
  <title>拾迹的小应用</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #243b53; background: #f8f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(880px, 100%); margin: auto; padding: 80px 28px 48px; }
    .signature { margin: 0 0 36px; font-size: 14px; letter-spacing: .08em; color: #677b8a; }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 48px); line-height: 1.2; letter-spacing: -.035em; }
    .intro { margin: 0 0 48px; color: #617383; line-height: 1.8; }
    .app { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 24px; padding: 28px; border: 1px solid #dbe1e5; border-radius: 16px; background: white; color: inherit; text-decoration: none; transition: border-color .18s, transform .18s; }
    .app:hover { border-color: #3567ad; transform: translateY(-2px); }
    .app:focus-visible { outline: 3px solid #3567ad; outline-offset: 5px; }
    .symbol { display: grid; place-items: center; width: 64px; height: 64px; background: #edf4ff; color: #3567ad; border-radius: 16px; font-size: 40px; }
    h2 { margin: 0 0 10px; font-size: 23px; }
    .description { margin: 0; color: #617383; font-size: 15px; line-height: 1.8; }
    .open { color: #3567ad; font-size: 15px; white-space: nowrap; }
    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid #e1e5e7; font-size: 13px; color: #677b8a; }
    @media (max-width: 540px) { main { padding-top: 48px; } .app { grid-template-columns: 48px 1fr; gap: 18px; padding: 22px; } .symbol { width: 48px; height: 48px; font-size: 32px; } .open { grid-column: 2; } h2 { font-size: 21px; } }
    @media (prefers-reduced-motion: reduce) { .app { transition: none; } .app:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="signature">SHIJI / 小应用集</p>
    <h1>拾迹的小应用</h1>
    <p class="intro">让日常多一点方便，多一点乐趣。</p>
    <a class="app" href="./math-island/">
      <span class="symbol" aria-hidden="true">×</span>
      <div>
        <h2>口算探险岛</h2>
        <p class="description">转出今天的数学冒险。二上视算 98 道题，支持换题、A4 PDF 下载与打印。</p>
      </div>
      <span class="open">开始冒险 <span aria-hidden="true">↗</span></span>
    </a>
    <footer>一些小工具，一点小乐趣。</footer>
  </main>
</body>
</html>
